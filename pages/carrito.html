<body>

<header>

    <div class="contenedor-header">

        <div class="logo-header">

            <img src="../img/Rincon_matero.jpg" alt="Logo">

            <h1>Rincón Matero</h1>

        </div>

        <div class="carrito-header">

            <a href="./carrito.html">
                🛒 <span id="contador-carrito">0</span>
            </a>

        </div>

    </div>

    <nav class="navbar navbar-expand-lg menu-personalizado">

        <div class="container-fluid">

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./productos.html">

                        </a>
                    </li>

                    <li class="nav-item">

                        </a>
                    </li>

                        </a>
                    </li>

                </ul>

        </div>

    </nav>

</header>

<main>

    <section class="titulo-seccion">

        <h2>Tu carrito</h2>

    </section>

    <section class="carrito">

        <div id="lista-carrito"></div>

        <h3 id="total">
            Total: $0
        </h3>

        <form class="formulario-compra" id="formulario-compra">

            <input type="text" placeholder="Nombre completo" required>

            <input type="email" placeholder="Correo electrónico" required>

            <input type="text" placeholder="Dirección de envío" required>

            <button type="submit">
                Finalizar compra
            </button>

        </form>

    </section>

</main>

<footer>

    <div class="footer-contenido">

        <div class="footer-columna">

            <h3>Rincón Matero</h3>

            <p>
                Tienda especializada en mates, termos y yerbas premium.
            </p>

        </div>

        <div class="footer-columna">
